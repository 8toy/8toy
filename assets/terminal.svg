<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="Terminal: whoami Sora | おに, github user @8toy, status online building">
  <style>
    text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 15px; }
    .g { fill: #a78bfa; }
    .w { fill: #f0ecff; }
    .d { fill: #3a3470; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.5s; }
    .l2 { animation-delay: 1.3s; }
    .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 2.9s; }
    .l5 { animation-delay: 3.7s; }
    .l6 { animation-delay: 4.5s; }
    .cur { animation: blink 1s steps(1) infinite; animation-delay: 3.7s; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="598" height="268" rx="12" fill="#050505" stroke="#26204a" stroke-width="1"/>
  <circle cx="28" cy="26" r="6" fill="#3a3470"/>
  <circle cx="50" cy="26" r="6" fill="#3a3470"/>
  <circle cx="72" cy="26" r="6" fill="#3a3470"/>
  <line x1="1" y1="48" x2="599" y2="48" stroke="#26204a" stroke-width="1"/>

  <text class="l l1 g" x="30" y="84">$ whoami</text>
  <text class="l l2 w" x="30" y="112">Sora | おに</text>

  <text class="l l3 g" x="30" y="148">$ github --user</text>
  <text class="l l4 w" x="30" y="176">@8toy</text>

  <text class="l l5 g" x="30" y="212">$ status</text>
  <rect class="cur g" x="112" y="199" width="9" height="16"/>

  <g class="l l6">
    <rect x="30" y="228" width="70" height="24" rx="12" fill="#0f0c20" stroke="#7dd3fc" stroke-width="1"/>
    <text class="g" x="65" y="245" text-anchor="middle" style="font-size:12px">online</text>
    <rect x="110" y="228" width="84" height="24" rx="12" fill="#0f0c20" stroke="#7dd3fc" stroke-width="1"/>
    <text class="g" x="152" y="245" text-anchor="middle" style="font-size:12px">building</text>
  </g>
</svg>
