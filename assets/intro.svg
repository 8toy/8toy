<text x="72" y="187" textLength="102" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp0)">七転び八起き</text>
<text x="72" y="211" textLength="257.4" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en0)">Fall seven times, stand up eight.</text>
<text x="72" y="187" textLength="68" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp1)">一期一会</text>
<text x="72" y="211" textLength="319.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en1)">Once in a lifetime, treasure this moment.</text>
<text x="72" y="187" textLength="102" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp2)">継続は力なり</text>
<text x="72" y="211" textLength="163.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en2)">Persistence is power.</text>
<text x="72" y="187" textLength="153" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp3)">千里の道も一歩から</text>
<text x="72" y="211" textLength="296.4" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en3)">A long road begins with a single step.</text>
<text x="72" y="187" textLength="136" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp4)">雨降って地固まる</text>
<text x="72" y="211" textLength="296.4" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en4)">After the rain, the ground grows firm.</text>
<text x="72" y="187" textLength="136" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp5)">猿も木から落ちる</text>
<text x="72" y="211" textLength="226.2" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en5)">Even monkeys fall from trees.</text>
<text x="72" y="187" textLength="85" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp6)">花より団子</text>
<text x="72" y="211" textLength="265.2" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en6)">Substance matters more than looks.</text>
<text x="72" y="187" textLength="136" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp7)">失敗は成功のもと</text>
<text x="72" y="211" textLength="241.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en7)">Failure is the root of success.</text>
<text x="72" y="187" textLength="119" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp8)">石の上にも三年</text>
<text x="72" y="211" textLength="226.2" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en8)">Patience pays off in the end.</text>
<text x="72" y="187" textLength="68" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp9)">十人十色</text>
<text x="72" y="211" textLength="179.4" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en9)">Ten people, ten colors.</text>
<text x="72" y="187" textLength="170" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp10)">案ずるより産むが易し</text>
<text x="72" y="211" textLength="234" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en10)">Doing is easier than worrying.</text>
<text x="72" y="187" textLength="136" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp11)">初心忘るべからず</text>
<text x="72" y="211" textLength="280.8" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en11)">Never forget your beginner's spirit.</text>
<text x="72" y="187" textLength="170" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp12)">塵も積もれば山となる</text>
<text x="72" y="211" textLength="296.4" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en12)">Even dust piled up becomes a mountain.</text>
<text x="72" y="187" textLength="136" lengthAdjust="spacingAndGlyphs" class="sans" font-size="17" fill="#eaf4ff" clip-path="url(#jp13)">笑う門には福来る</text>
<text x="72" y="211" textLength="249.6" lengthAdjust="spacingAndGlyphs" class="mono" font-size="13" fill="#6cc4ff" clip-path="url(#en13)">Fortune comes to a smiling home.</text>
</svg>
