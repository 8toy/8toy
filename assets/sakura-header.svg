 <use href="#petal" x="380" y="-35"><animateTransform attributeName="transform" type="translate" values="0 -35;-18 365" dur="8s" begin="-3s" repeatCount="indefinite"/></use>
 <use href="#petal" x="620" y="-20"><animateTransform attributeName="transform" type="translate" values="0 -20;24 365" dur="6.5s" begin="-1s" repeatCount="indefinite"/></use>
 <use href="#petal" x="720" y="-50"><animateTransform attributeName="transform" type="translate" values="0 -50;-30 365" dur="7.5s" begin="-5s" repeatCount="indefinite"/></use>
 <use href="#petal" x="900" y="-15"><animateTransform attributeName="transform" type="translate" values="0 -15;16 365" dur="5.8s" begin="-2.5s" repeatCount="indefinite"/></use>
